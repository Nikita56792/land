[package]
name = "parhelio-launcher"
version = "1.0.0"
description = "Parhelio Launcher — быстрый загрузчик и установщик игр Wii U на SD-карту (macOS / Windows / Linux)"
authors = ["Parhelio <hello@parhelio.ru>"]
edition = "2021"

[lib]
name = "parhelio_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
