server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Direct binary file serving for server mirror copies (.wuhb, .dmg, .pkg, .zip).
    # Never fall back to index.html so client mirror probe gets real 404 when absent.
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=3600";
        etag on;
    }

    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
